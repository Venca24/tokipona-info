# Resource Hints
resource_hints:
  - url: https://fonts.googleapis.com
    links:
      - rel: preconnect
      - rel: dns-prefetch
  - url: https://fonts.gstatic.com
    links:
      - rel: preconnect
        opts: [crossorigin]
      - rel: dns-prefetch

# Web Fonts
webfonts: https://fonts.googleapis.com/css2?family=Lato:wght@300;400&family=Source+Sans+Pro:wght@400;600;700;900&display=swap

# Libraries

bootstrap:
  css: /assets/css/bootstrap.min.css

toc:
  css: /assets/css/tocbot.min.css
  js: /assets/js/tocbot.min.js

fontawesome:
  css: /assets/css/fontawesome-free-all.min.css

search:
  js: /assets/js/simple-jekyll-search.min.js

mermaid:
  js: /assets/js/mermaid.min.js

dayjs:
  js:
    common: https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js
    locale: https://cdn.jsdelivr.net/npm/dayjs@1/locale/:LOCALE.js
    relativeTime: https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js
    localizedFormat: https://cdn.jsdelivr.net/npm/dayjs@1/plugin/localizedFormat.js

glightbox:
  css: /assets/css/glightbox.min.css
  js: /assets/js/glightbox.min.js

lazy-polyfill:
  css: /assets/css/loading-attribute-polyfill.min.css
  js: /assets/js/loading-attribute-polyfill.umd.min.js

clipboard:
  js: /assets/js/clipboard.min.js

mathjax:
  js: /assets/js/tex-mml-chtml.js
