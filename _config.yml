theme: jekyll-theme-chirpy

lang: en

timezone: UTC

title: tokipona.info

avatar: "/assets/img/Toki_pona2-fb.png"

tagline: toki pona en 76 ilustritaj lecionoj

description: >-
  toki pona en 76 ilustritaj lecionoj

theme_mode: light

toc: false

assets:
  self_host:
    enabled: true

pwa:
  enabled: true
  cache:
    enabled: true

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "/cs/"
      type: pages
    values:
      layout: page
      comments: false
      lang: cs-CZ
      permalink: /cs/:title/
  - scope:
      path: "/eo/"
      type: pages
    values:
      layout: page
      comments: false
      lang: eo
      permalink: /eo/:title/

compress_html:
  clippings: false
  comments: false
  endings: false
  profile: false
  blanklines: false

exclude:
  - AGENTS.md
  - CONTRIBUTING.md
  - Dockerfile
  - LICENSE
  - Rakefile
  - README.md
  - README.eo.md
  - purgecss.js
  - "*.config.js"
  - "package*.json"
